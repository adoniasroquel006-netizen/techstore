<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#090d24">
    <title>TechStore · Accesorios tecnológicos</title>
    <style>
/* VARIABLES DE COLOR Y ESTILOS GENERALES */
:root {
  --ink: #101328;
  --muted: #697086;
  --violet: #6520df;
  --violet-dark: #4514bd;
  --line: #e5e5ef;
  --bg: #f7f7fc;
  --soft: #f2ebff;
  --green: #16814b;
  --shadow: 0 6px 28px #24204b0b
}

* {
  box-sizing: border-box
}

html {
  scroll-behavior: smooth
}

body {
  margin: 0;
  color: var(--ink);
  font: 15px/1.5 Arial,Helvetica,sans-serif;
  background: var(--bg)
}

button,input,select,textarea {
  font: inherit
}

button,a,input,select,textarea {
  -webkit-tap-highlight-color: transparent
}

button {
  cursor: pointer
}

button:disabled {
  opacity: .45;
  cursor: not-allowed
}

button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible {
  outline: 3px solid #a979ff;
  outline-offset: 3px
}

a {
  color: inherit;
  text-decoration: none
}

button {
  color: inherit
}

/* ICONOS Y BOTONES */
.icon {
  width: 21px;
  height: 21px;
  display: inline-block;
  vertical-align: middle;
  flex-shrink: 0;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  border: 0;
  border-radius: 10px;
  padding: 12px 19px;
  font-weight: 700;
  font-size: 14px;
  min-height: 44px;
  background: linear-gradient(135deg,#902bed,#4816c9);
  color: white;
  box-shadow: 0 4px 10px #6420df1a;
  transition: transform .15s,box-shadow .15s
}

.btn:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 7px 16px #6420df30
}

.btn.secondary {
  color: var(--violet);
  background: var(--soft);
  box-shadow: none
}

.btn.outline {
  background: white;
  border: 1px solid var(--line);
  color: var(--ink);
  box-shadow: none
}

.btn.danger {
  background: #fff0f1;
  color: #bd2844;
  box-shadow: none
}

.btn.small {
  padding: 8px 13px;
  min-height: 35px;
  font-size: 12px
}

.btn.full {
  width: 100%
}

.plain {
  border: 0;
  background: none;
  padding: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border-radius: 8px
}

.plain:hover {
  background: #f2eaff;
  color: var(--violet)
}

.plain.danger {
  color: #bf2949
}

.text-link {
  color: var(--violet);
  font-weight: 700
}

.muted {
  color: var(--muted)
}

.small-text {
  font-size: 12px
}

.eyebrow {
  text-transform: uppercase;
  letter-spacing: 1.7px;
  font-size: 11px;
  font-weight: 700;
  color: #bba5ff
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  border-radius: 20px;
  background: var(--soft);
  color: #5721b8;
  font-size: 11px;
  font-weight: 700
}

.pill.green {
  background: #daf5e5;
  color: #126a39
}

.pill.orange {
  background: #fff0d8;
  color: #9e5a00
}

.pill.red {
  background: #ffe8ed;
  color: #ad2342
}

.pill.gray {
  background: #eceef4;
  color: #596075
}

/* CONTENEDORES Y NAVEGACIÓN */
.wrap {
  max-width: 1240px;
  margin: auto;
  padding: 0 28px
}

.topbar {
  background: #060c20;
  color: #fff;
  position: sticky;
  top: 0;
  z-index: 20;
  border-bottom: 1px solid #25283c
}

.header {
  min-height: 76px;
  display: flex;
  align-items: center;
  gap: 26px
}

.brand {
  display: flex;
  align-items: center;
  margin-right: auto;
  flex-shrink: 0
}

.brand img {
  width: 155px;
  height: auto;
  display: block
}

.nav {
  display: flex;
  gap: 9px;
  align-items: center
}

.nav a {
  font-size: 13px;
  padding: 9px 13px;
  border-radius: 10px;
  color: #dbdce8
}

.nav a.active,.nav a:hover {
  background: #30205d;
  color: #fff
}

.mode {
  display: flex;
  border: 1px solid #3c365c;
  border-radius: 25px;
  background: #11152c;
  padding: 3px;
  gap: 1px
}

.mode button {
  color: #dedbea;
  border: 0;
  background: transparent;
  border-radius: 21px;
  padding: 8px 12px;
  font-size: 11px;
  display: flex;
  gap: 6px;
  align-items: center
}

.mode button.active {
  background: linear-gradient(135deg,#9b30f6,#6221d7);
  color: #fff
}

.mode .icon {
  width: 16px;
  height: 16px
}

.header-cart {
  position: relative;
  border: 1px solid #38324e;
  border-radius: 50%;
  width: 43px;
  height: 43px;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0
}

.counter {
  position: absolute;
  top: -5px;
  right: -5px;
  background: white;
  color: #6220d1;
  min-width: 18px;
  height: 18px;
  border-radius: 10px;
  font-size: 10px;
  text-align: center;
  font-weight: 700;
  padding: 1px 4px
}

.favorite-nav {
  color: #d8c8ff;
  border: 0;
  background: none;
  position: relative
}

.favorite-nav.active {
  color: #c276ff
}

.notice {
  background: #f0eaff;
  border-bottom: 1px solid #e4d9f7;
  text-align: center;
  font-size: 11px;
  color: #633e9c;
  padding: 6px 16px
}

/* PORTADA Y BENEFICIOS */
.hero {
  background: #040d21;
  color: #fff;
  overflow: hidden
}

.hero-inner {
  position: relative;
  min-height: 380px;
  display: flex;
  align-items: center;
  isolation: isolate
}

.hero-copy {
  width: 58%;
  padding: 39px 0 30px;
  position: relative;
  z-index: 2
}

.hero h1 {
  font-size: clamp(32px,4.1vw,49px);
  letter-spacing: -1.6px;
  line-height: 1.1;
  margin: 15px 0 17px;
  max-width: 580px
}

.hero p {
  color: #e2deef;
  font-size: 16px;
  max-width: 480px;
  margin: 0 0 22px
}

.hero-art {
  position: absolute;
  right: 0;
  top: 0;
  height: 100%;
  width: 46%;
  object-fit: cover;
  object-position: center 30%;
  z-index: 0
}

.hero-shade {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg,#040d21 0%,#040d21 42%,#040d2100 70%);
  z-index: 1
}

.hero-service-mask {
  position: absolute;
  right: 34%;
  bottom: 0;
  width: 12%;
  height: 84px;
  background: linear-gradient(90deg,#040d21,#071329);
  z-index: 1
}

.benefits {
  display: flex;
  gap: 29px;
  margin-top: 33px;
  flex-wrap: wrap
}

.benefit {
  display: flex;
  gap: 10px;
  align-items: center;
  background: none;
  border: 0;
  color: white;
  text-align: left;
  padding: 0
}

.benefit .icon {
  width: 26px;
  height: 26px
}

.benefit strong {
  font-size: 11px;
  display: block
}

.benefit span {
  font-size: 10px;
  color: #c4c4d7
}

/* CATÁLOGO, BÚSQUEDA Y FILTROS */
.section {
  padding: 32px 0
}

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 21px
}

.section-heading h1,.section-heading h2 {
  margin: 0;
  font-size: 25px;
  letter-spacing: -.8px
}

.accent-title {
  border-left: 3px solid var(--violet);
  padding-left: 13px
}

.searchbar {
  display: flex;
  gap: 9px;
  align-items: center;
  flex-wrap: wrap
}

.search {
  position: relative;
  min-width: 230px;
  flex: 1
}

.search input {
  padding: 11px 36px;
  border: 1px solid var(--line);
  border-radius: 24px;
  width: 100%;
  background: #fff;
  font-size: 12px
}

.search .icon {
  position: absolute;
  left: 12px;
  top: 12px;
  width: 17px;
  height: 17px;
  color: #504b6d
}

.chips {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 24px
}

.chip {
  border: 1px solid var(--line);
  background: #fff;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px 19px;
  border-radius: 24px;
  font-size: 12px;
  font-weight: 700
}

.chip.active {
  background: linear-gradient(135deg,#9231ee,#5b1bd2);
  color: white;
  border-color: transparent;
  box-shadow: 0 4px 10px #6020d51c
}

.filter-panel {
  display: flex;
  gap: 14px;
  align-items: end;
  background: white;
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 17px;
  margin-bottom: 20px;
  flex-wrap: wrap
}

.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
  font-size: 12px;
  font-weight: 700;
  min-width: 0
}

.field input,.field select,.field textarea {
  width: 100%;
  border: 1px solid #dcdce8;
  background: white;
  color: var(--ink);
  border-radius: 9px;
  padding: 11px 12px;
  font-size: 13px;
  min-height: 42px
}

.field input:disabled {
  background: #f0f0f6;
  color: #777
}

.field textarea {
  min-height: 86px;
  resize: vertical
}

.field .hint {
  font-size: 11px;
  color: var(--muted);
  font-weight: 400
}

.filter-panel .field {
  flex: 1;
  min-width: 145px
}

/* TARJETAS DE PRODUCTOS */
.grid-products {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 19px
}

.product {
  position: relative;
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 14px;
  background: #fff;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  min-width: 0;
  transition: transform .18s
}

.product:hover {
  transform: translateY(-3px)
}

.product .badge {
  position: absolute;
  left: 13px;
  top: 13px;
  z-index: 1
}

.product .favorite {
  position: absolute;
  right: 9px;
  top: 7px;
  z-index: 2;
  background: #ffffffd9
}

.favorite.on {
  color: #6922df
}

.favorite.on .icon {
  fill: #eee2ff
}

.product-photo {
  height: 178px;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px 5px 0;
  border: 0;
  background: white;
  border-radius: 9px
}

.product-photo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  mix-blend-mode: multiply
}

.product h3 {
  font-size: 15px;
  margin: 16px 3px 5px;
  line-height: 1.4;
  min-height: 42px
}

.product h3 button {
  text-align: left;
  font-weight: 700;
  background: none;
  border: 0;
  padding: 0
}

.product h3 button:hover {
  color: var(--violet)
}

.product .price {
  font-size: 21px;
  color: #261075;
  font-weight: 800;
  margin: 1px 3px 2px
}

.product .stock {
  font-size: 10px;
  color: var(--muted);
  margin: 0 3px 12px
}

.product .btn {
  margin-top: auto;
  font-size: 12px;
  padding: 10px
}

/* BANNER Y PIE DE PÁGINA */
.banner {
  position: relative;
  overflow: hidden;
  border-radius: 15px;
  min-height: 115px;
  background: #11072c;
  color: white;
  margin: 26px 0 7px;
  display: flex;
  align-items: center;
  padding: 24px 30px;
  gap: 20px
}

.banner>img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover
}

.banner:after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg,#27105af5,#27105ab5 50%,#27105a00)
}

.banner>*:not(img) {
  z-index: 1;
  position: relative
}

.banner h3 {
  font-size: 23px;
  margin: 0;
  letter-spacing: -.5px
}

.banner p {
  font-size: 12px;
  margin: 2px 0
}

.banner .btn {
  margin-left: auto;
  flex-shrink: 0
}

.footer {
  border-top: 1px solid var(--line);
  padding: 24px 0;
  margin-top: 30px;
  background: white
}

.footer-row {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: center;
  font-size: 11px;
  color: var(--muted);
  flex-wrap: wrap
}

.footer b {
  font-size: 17px;
  color: #25153f
}

.footer b span {
  color: var(--violet)
}

/* CARRITO Y RESUMEN DE COMPRA */
.heading-back {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 25px 0 23px
}

.heading-back h1 {
  margin: 0;
  font-size: 25px;
  letter-spacing: -.6px
}

.card {
  background: white;
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 23px;
  box-shadow: var(--shadow)
}

.cart-layout {
  display: grid;
  grid-template-columns: minmax(0,1fr) 330px;
  gap: 24px;
  align-items: start
}

.cart-row {
  display: grid;
  grid-template-columns: 85px minmax(0,1fr) auto;
  align-items: center;
  gap: 15px;
  padding: 17px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: white;
  margin-bottom: 10px
}

.cart-row img {
  width: 82px;
  height: 65px;
  object-fit: contain
}

.cart-row h3 {
  margin: 0 0 6px;
  font-size: 13px
}

.cart-row p {
  margin: 0;
  font-weight: 700;
  font-size: 14px
}

.cart-actions {
  display: flex;
  align-items: center;
  gap: 12px
}

.quantity {
  border: 1px solid var(--line);
  border-radius: 9px;
  display: inline-flex;
  align-items: center;
  background: #fff;
  height: 36px
}

.quantity button {
  border: 0;
  background: none;
  width: 33px;
  height: 34px;
  color: #4c396e;
  font-size: 19px;
  border-radius: 8px
}

.quantity button:hover {
  background: var(--soft)
}

.quantity span {
  min-width: 24px;
  text-align: center;
  font-weight: 700;
  font-size: 13px
}

.summary {
  position: sticky;
  top: 102px
}

.summary h2 {
  font-size: 18px;
  margin: 0 0 22px
}

.summary-row {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin: 15px 0;
  gap: 12px
}

.summary-row.total {
  border-top: 1px solid var(--line);
  padding-top: 18px;
  font-size: 18px;
  font-weight: 700
}

.summary-row.total strong {
  color: var(--violet);
  font-size: 24px
}

.summary .btn {
  margin: 10px 0
}

.info-box {
  padding: 14px;
  background: #eef0ff;
  color: #3f3971;
  border-radius: 10px;
  font-size: 11px;
  display: flex;
  gap: 11px;
  margin-top: 13px;
  align-items: flex-start
}

.info-box .icon {
  color: #6130c7;
  width: 19px
}

.delivery-options {
  display: grid;
  gap: 10px;
  margin-bottom: 18px
}

.delivery-option {
  display: flex;
  align-items: center;
  gap: 13px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px;
  cursor: pointer;
  background: white
}

.delivery-option.selected {
  border-color: var(--violet);
  background: #f8f3ff
}

.delivery-option input {
  accent-color: var(--violet)
}

.delivery-option .icon {
  width: 28px;
  height: 28px;
  color: var(--violet)
}

.delivery-option strong {
  font-size: 13px;
  display: block
}

.delivery-option span {
  font-size: 11px;
  color: var(--muted)
}

/* FORMULARIOS Y ESTADOS VACÍOS */
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px
}

.form-grid .span2 {
  grid-column: 1/-1
}

.block-title {
  font-size: 17px;
  margin: 23px 0 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px
}

.empty {
  text-align: center;
  padding: 64px 20px;
  background: white;
  border: 1px dashed #d9c9ef;
  border-radius: 16px
}

.empty>.icon {
  width: 45px;
  height: 45px;
  color: #9d76df
}

.empty h2 {
  font-size: 21px;
  margin: 12px 0 7px
}

.empty p {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 22px
}

/* DETALLE DEL PRODUCTO Y GALERÍA */
.breadcrumb {
  display: flex;
  gap: 9px;
  align-items: center;
  color: var(--muted);
  font-size: 12px;
  margin: 23px 0
}

.breadcrumb button {
  border: 0;
  background: none;
  color: var(--violet);
  padding: 0
}

.detail-layout {
  display: grid;
  grid-template-columns: 1.12fr 1fr;
  gap: 33px;
  align-items: start
}

.gallery {
  position: relative;
  background: white;
  border: 1px solid var(--line);
  border-radius: 15px;
  min-height: 460px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 38px
}

.gallery .thumbnail {
  position: absolute;
  left: 15px;
  top: 15px;
  width: 68px;
  height: 68px;
  object-fit: contain;
  border: 1px solid var(--violet);
  padding: 7px;
  border-radius: 11px;
  background: white
}

.gallery-main {
  width: 100%;
  height: 350px;
  object-fit: contain;
  cursor: zoom-in
}

.gallery .zoom-hint {
  position: absolute;
  bottom: 13px;
  font-size: 11px;
  color: var(--violet);
  background: var(--soft);
  border: 0;
  border-radius: 20px;
  padding: 7px 14px
}

.detail-info h1 {
  font-size: 31px;
  letter-spacing: -.8px;
  line-height: 1.15;
  margin: 13px 0
}

.detail-info .description {
  color: var(--muted);
  font-size: 14px
}

.detail-price {
  font-size: 36px;
  font-weight: 800;
  color: #2c107b;
  margin: 13px 0 20px
}

.availability {
  color: var(--green);
  font-size: 12px;
  font-weight: 700;
  margin: 15px 0
}

.delivery-brief {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 17px;
  margin-bottom: 20px
}

.delivery-brief>div {
  display: flex;
  gap: 13px;
  margin: 5px 0 16px;
  align-items: center;
  font-size: 12px
}

.delivery-brief>div:last-child {
  margin-bottom: 4px
}

.delivery-brief .icon {
  color: var(--violet);
  width: 24px
}

.buy-row {
  display: flex;
  gap: 15px;
  align-items: end
}

.buy-row>.btn {
  flex: 1;
  min-height: 44px
}

.buy-row .quantity {
  height: 44px
}

.detail-tabs {
  margin-top: 30px
}

.tabs {
  display: flex;
  gap: 24px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 20px
}

.tab {
  border: 0;
  background: none;
  padding: 0 0 14px;
  font-weight: 700;
  font-size: 14px;
  border-bottom: 3px solid transparent
}

.tab.active {
  border-color: var(--violet);
  color: var(--violet)
}

.specs {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px
}

.specs td {
  padding: 11px;
  border-bottom: 1px solid var(--line)
}

.specs td:first-child {
  font-weight: 700;
  background: #faf9fd;
  width: 40%
}

/* PANEL DEL ADMINISTRADOR */
.admin-heading {
  display: flex;
  gap: 14px;
  align-items: center;
  margin: 29px 0 25px
}

.admin-heading>.icon {
  width: 35px;
  height: 35px;
  color: var(--violet)
}

.admin-heading h1 {
  font-size: 26px;
  letter-spacing: -.8px;
  margin: 0
}

.admin-heading p {
  font-size: 12px;
  color: var(--muted);
  margin: 3px 0
}

.admin-layout {
  display: grid;
  grid-template-columns: 165px minmax(0,1fr);
  gap: 22px;
  align-items: start
}

.admin-nav {
  display: flex;
  flex-direction: column;
  gap: 8px
}

.admin-nav a {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  padding: 12px 15px;
  border-radius: 10px
}

.admin-nav a.active {
  background: linear-gradient(135deg,#8230e8,#4f1dc9);
  color: #fff
}

.admin-nav a:hover:not(.active) {
  background: #ece7f6
}

.admin-card {
  min-width: 0
}

.admin-card .section-heading h2 {
  font-size: 18px
}

.table-wrap {
  overflow-x: auto
}

table.data {
  border-collapse: collapse;
  width: 100%;
  font-size: 12px;
  white-space: nowrap
}

table.data th {
  padding: 13px 10px;
  background: #f6f5fa;
  font-size: 10px;
  text-align: left;
  color: #3f3b57
}

table.data td {
  padding: 12px 10px;
  border-bottom: 1px solid #efedf6
}

table.data tr:last-child td {
  border: 0
}

table.data tbody tr:hover {
  background: #fcfaff
}

.table-product {
  display: flex;
  gap: 10px;
  align-items: center;
  white-space: normal;
  min-width: 180px;
  font-weight: 700
}

.table-product img {
  width: 40px;
  height: 36px;
  object-fit: contain
}

.table-product small {
  display: block;
  font-size: 9px;
  color: var(--muted);
  font-weight: 400;
  margin-top: 3px
}

.table-actions {
  display: flex;
  gap: 2px
}

.table-actions .plain {
  padding: 6px
}

.table-actions .icon {
  width: 16px;
  height: 16px
}

.stats {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 12px;
  margin-bottom: 20px
}

.stat {
  background: #f7f3ff;
  padding: 14px;
  border-radius: 12px
}

.stat span {
  display: block;
  color: #78668f;
  font-size: 11px
}

.stat b {
  font-size: 23px;
  color: #4c1d93
}

/* PEDIDOS E HISTORIAL */
.orders-list {
  display: grid;
  gap: 14px
}

.order-card {
  display: flex;
  gap: 15px;
  align-items: center;
  flex-wrap: wrap
}

.order-card .order-name {
  margin-right: auto
}

.order-card h3 {
  margin: 0 0 4px;
  font-size: 15px
}

.order-card p {
  font-size: 12px;
  margin: 0;
  color: var(--muted)
}

.order-card strong {
  font-size: 19px;
  color: #411789
}

.order-detail-grid {
  display: grid;
  grid-template-columns: minmax(0,1fr) 320px;
  gap: 22px
}

.order-line {
  display: flex;
  gap: 14px;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid var(--line)
}

.order-line img {
  width: 65px;
  height: 55px;
  object-fit: contain
}

.order-line strong {
  display: block;
  font-size: 13px
}

.order-line span {
  font-size: 12px;
  color: var(--muted)
}

.order-line>b {
  margin-left: auto;
  font-size: 13px
}

.timeline {
  list-style: none;
  padding: 0;
  margin: 16px 0 0
}

.timeline li {
  border-left: 2px solid #dfd0f6;
  padding: 0 0 20px 18px;
  position: relative;
  font-size: 12px
}

.timeline li:before {
  content: '';
  position: absolute;
  width: 8px;
  height: 8px;
  background: var(--violet);
  border-radius: 50%;
  left: -5px;
  top: 4px
}

.timeline small {
  color: var(--muted);
  display: block;
  margin-top: 3px
}

.flex-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap
}

.between {
  justify-content: space-between
}

.stack {
  display: grid;
  gap: 12px
}

.divider {
  height: 1px;
  background: var(--line);
  margin: 18px 0
}

.alert {
  border-radius: 9px;
  background: #fff5dc;
  border: 1px solid #f2d99c;
  color: #865800;
  padding: 12px;
  font-size: 12px;
  margin: 13px 0
}

.error-message {
  background: #fff0f3;
  color: #ae2446;
  border-radius: 9px;
  padding: 11px;
  font-size: 12px;
  margin: 13px 0
}

.result-count {
  font-size: 11px;
  color: var(--muted);
  margin: 0 0 15px
}

/* VENTANAS MODALES Y NOTIFICACIONES */
.dialog {
  border: 0;
  border-radius: 18px;
  padding: 0;
  box-shadow: 0 25px 100px #0c052540;
  max-width: 600px;
  width: calc(100% - 32px);
  color: var(--ink);
  max-height: 90vh
}

.dialog::backdrop {
  background: #07091d9e;
  backdrop-filter: blur(3px)
}

.dialog-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 21px 25px;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: white;
  z-index: 2
}

.dialog-head h2 {
  font-size: 20px;
  margin: 0;
  letter-spacing: -.4px
}

.dialog-body {
  padding: 23px 25px
}

.dialog-foot {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding-top: 20px;
  flex-wrap: wrap
}

.dialog.wide {
  max-width: 920px
}

.image-view {
  height: 55vh;
  overflow: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  background: white;
  border-radius: 12px
}

.image-view img {
  max-width: none;
  object-fit: contain;
  width: 80%;
  height: 90%;
  transform-origin: center
}

.toast-region {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: max-content;
  max-width: calc(100% - 30px)
}

.toast {
  background: #201039;
  color: white;
  padding: 13px 20px;
  border-radius: 12px;
  box-shadow: 0 8px 30px #0002;
  font-size: 13px;
  display: flex;
  gap: 10px;
  align-items: center
}

.toast.error {
  background: #8c2142
}

.storage-banner {
  background: #fff0ce;
  color: #714c00;
  padding: 10px;
  text-align: center;
  font-size: 12px
}

.pagination {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 22px
}

.sr-only {
  position: absolute;
  clip: rect(0,0,0,0);
  width: 1px;
  height: 1px;
  overflow: hidden
}

.switch-label {
  display: flex;
  gap: 9px;
  align-items: center;
  font-size: 12px
}

.switch-label input {
  accent-color: var(--violet)
}

input[type=radio],input[type=checkbox] {
  accent-color: var(--violet)
}

.disabled-text {
  color: #a1a0ae
}

.wrap-anywhere {
  overflow-wrap: anywhere;
  white-space: normal
}

/* ADAPTACIÓN A PANTALLAS Y MOVIMIENTO REDUCIDO */
@media(min-width:1000px) {
  .hero .wrap {
    padding-right: 0
  }
}

@media(max-width:1050px) {
  .header {
    gap: 13px
  }
  .nav {
    gap: 0
  }
  .nav a {
    padding: 8px;
    font-size: 12px
  }
  .mode button {
    padding: 8px
  }
  .mode button .icon {
    display: none
  }
  .grid-products {
    gap: 12px
  }
  .cart-layout {
    grid-template-columns: minmax(0,1fr) 290px
  }
  .benefits {
    gap: 15px
  }
  .cart-row {
    grid-template-columns: 65px minmax(0,1fr)
  }
  .cart-row img {
    width: 62px
  }
  .cart-actions {
    grid-column: 2
  }
  .admin-layout {
    grid-template-columns: 140px minmax(0,1fr)
  }
}

@media(max-width:760px) {
  .wrap {
    padding: 0 17px
  }
  .header {
    flex-wrap: wrap;
    padding-top: 12px;
    padding-bottom: 10px;
    gap: 12px;
    min-height: unset
  }
  .brand img {
    width: 140px
  }
  .nav {
    order: 4;
    width: 100%;
    justify-content: center
  }
  .nav a {
    padding: 7px 15px;
    font-size: 12px
  }
  .mode {
    margin-left: auto
  }
  .header-cart {
    width: 36px;
    height: 36px
  }
  .header>.favorite-nav {
    display: none
  }
  .hero-inner {
    min-height: 350px
  }
  .hero-copy {
    width: 82%;
    padding: 32px 0
  }
  .hero h1 {
    font-size: 36px;
    max-width: 410px
  }
  .hero p {
    font-size: 13px;
    max-width: 300px
  }
  .hero-art {
    width: 57%;
    opacity: .65
  }
  .hero-shade {
    background: linear-gradient(90deg,#040d21 0%,#040d21ed 32%,#040d2150 100%)
  }
  .hero-service-mask {
    display: none
  }
  .benefits {
    gap: 16px
  }
  .benefit .icon {
    width: 20px
  }
  .benefit strong {
    font-size: 10px
  }
  .benefit span {
    font-size: 9px
  }
  .section {
    padding: 25px 0
  }
  .section-heading {
    flex-wrap: wrap;
    gap: 14px
  }
  .section-heading h1,.section-heading h2 {
    font-size: 23px
  }
  .searchbar {
    width: 100%
  }
  .grid-products {
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 12px
  }
  .product {
    padding: 11px
  }
  .product-photo {
    height: 145px
  }
  .product h3 {
    font-size: 13px
  }
  .product .btn {
    font-size: 11px;
    gap: 5px;
    padding: 10px 6px
  }
  .product .btn .icon {
    width: 17px
  }
  .product .price {
    font-size: 20px
  }
  .chips {
    gap: 8px
  }
  .chip {
    font-size: 11px;
    padding: 8px 12px;
    gap: 5px
  }
  .chip .icon {
    width: 16px
  }
  .banner {
    padding: 20px;
    flex-wrap: wrap;
    gap: 12px
  }
  .banner h3 {
    font-size: 20px
  }
  .banner .btn {
    margin-left: 0
  }
  .cart-layout,.detail-layout,.order-detail-grid {
    grid-template-columns: 1fr
  }
  .summary {
    position: static
  }
  .detail-info h1 {
    font-size: 27px
  }
  .gallery {
    min-height: 320px;
    padding: 40px
  }
  .gallery-main {
    height: 260px
  }
  .detail-layout {
    gap: 22px
  }
  .admin-layout {
    grid-template-columns: 1fr
  }
  .admin-nav {
    flex-direction: row;
    overflow-x: auto
  }
  .admin-nav a {
    white-space: nowrap;
    font-size: 12px;
    padding: 9px 13px
  }
  .admin-heading h1 {
    font-size: 23px
  }
  .card {
    padding: 18px
  }
  .dialog-body {
    padding: 20px
  }
  .dialog-head {
    padding: 17px 20px
  }
  .form-grid {
    gap: 13px
  }
  .filter-panel {
    padding: 13px;
    gap: 10px
  }
  .stats {
    gap: 8px
  }
  .stat {
    padding: 11px
  }
  .stat b {
    font-size: 20px
  }
  .order-card {
    gap: 10px
  }
  .heading-back h1 {
    font-size: 23px
  }
  .footer-row {
    font-size: 10px
  }
  .image-view {
    height: 45vh
  }
}

@media(prefers-reduced-motion:reduce) {
  * {
    scroll-behavior: auto!important;
    transition: none!important
  }
}

let storageOK = true;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return seed();
    const s = JSON.parse(raw);
    if (s.version !== 1 || !Array.isArray(s.products) || !Array.isArray(s.orders) || !s.cart || !s.checkout || !Array.isArray(s.favorites) || !Array.isArray(s.adjustments) || !Number.isInteger(s.nextOrder)) throw Error('Datos no válidos');
    for (const p of s.products) if (!p.id || !Number.isSafeInteger(p.price) || p.price < 1 || !Number.isSafeInteger(p.stock) || p.stock < 0) throw Error('Producto no válido');
    return s;
  } catch (err) {
    storageOK = false;
    return seed();
  }
}

function saveState(next) {
  state = next;
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    storageOK = true;

  const n = document.getElementById('storage-warning');

}
function transaction(fn) {
  const next = clone(state);

}

function product(id, s = state) {
  return s.products.find(p => p.id === id);
}
function reserved(id, s = state) {
  return s.orders.filter(o => o.status === 'Pendiente de pago').reduce((n, o) => n + o.items.filter(i => i.id === id).reduce((v, i) => v + i.qty, 0), 0);
}
function available(id, s = state) {
  const p = product(id, s);
  return p ? Math.max(0, p.stock - reserved(id, s)) : 0;
}
function cartCount(s = state) {
  return Object.values(s.cart).reduce((a, q) => a + q, 0);
}
function cartLines(s = state) {
  return Object.entries(s.cart).map(([id, qty]) => ({
    p: product(id, s),
    qty
  })).filter(x => x.p);
}
function subtotal(s = state) {
  return cartLines(s).reduce((a, x) => a + x.p.price * x.qty, 0);
}
function shipping(s = state) {
  return cartCount(s) > 0 && s.checkout.delivery === 'delivery' ? 499 : 0;
}
function image(p) {
  return p.image.startsWith('data:image/') ? p.image : ASSETS[p.image] || ASSETS.mouse;
}
function friendlyError(err) {
  toast(err.message || 'No se pudo completar la operación.', true);
}
function demand(ok, message) {
  if (!ok) throw Error(message);
}
// ============================================================================
// OPERACIONES DEL CARRITO
// ============================================================================

function addToCart(id, qty = 1) {
  transaction(s => {
    const p = product(id, s);
    demand(p && p.active, 'Este producto ya no está publicado.');
    demand(Number.isSafeInteger(qty) && qty > 0, 'Cantidad no válida.');
    const count = (s.cart[id] || 0) + qty;
    demand(count <= available(id, s), 'No hay suficientes unidades disponibles.');
    s.cart[id] = count;
  });
}
function changeCart(id, delta) {
  transaction(s => {
    demand(s.cart[id], 'El producto no está en el carrito.');
    const q = s.cart[id] + delta;
    if (q <= 0) {
      delete s.cart[id];
      return;
    }
    demand(q <= available(id, s), 'No hay suficientes unidades disponibles.');
    s.cart[id] = q;
  });
}
// ============================================================================
// PEDIDOS, RESERVAS Y PAGOS SIMULADOS
// ============================================================================

function createOrder() {
  return transaction(s => {
    const rows = cartLines(s);
    demand(rows.length, 'Agrega un producto al carrito.');
    const c = s.checkout;
    demand(c.name.trim().length >= 2, 'Escribe tu nombre completo.');
    demand(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email), 'Escribe un correo válido.');
    demand(/^[+()\d\s-]{7,22}$/.test(c.phone), 'Escribe un teléfono válido.');
    demand(['delivery', 'pickup'].includes(c.delivery), 'Selecciona una modalidad válida.');
    if (c.delivery === 'delivery') {
      demand(c.address.trim().length >= 8, 'Escribe una dirección completa.');
      demand(c.zone === 'central', 'Selecciona una zona con cobertura o elige retiro en tienda.');
    }
    const items = rows.map(({
      p,
      qty
    }) => {
      demand(p.active, `${p.name} ya no está publicado.`);
      demand(qty <= available(p.id, s), `Revisa las unidades disponibles de ${p.name}.`);
      return {
        id: p.id,
        sku: p.sku,
        name: p.name,
        price: p.price,
        qty,
        image: p.image
      };
    });
    const sub = items.reduce((a, i) => a + i.price * i.qty, 0),
      ship = c.delivery === 'delivery' ? 499 : 0;
    const now = Date.now();
    const o = {
      id: 'TS-' + String(s.nextOrder++).padStart(5, '0'),
      created: now,
      expires: now + RESERVE_MS,
      status: 'Pendiente de pago',
      payment: 'Sin iniciar',
      reference: '',
      items,
      subtotal: sub,
      shipping: ship,
      total: sub + ship,
      delivery: c.delivery,
      customer: clone(c),
      history: [{
        status: 'Pendiente de pago',
        at: now,
        by: 'Cliente'
      }]
    };
    s.orders.unshift(o);
    s.cart = {};
    return o.id;
  });
}
function order(id, s = state) {
  return s.orders.find(o => o.id === id);
}
function record(o, status, by) {
  o.status = status;
  o.history.push({
    status,
    at: Date.now(),
    by
  });
}
function cancelOrder(id) {
  transaction(s => {
    const o = order(id, s);
    demand(o && o.status === 'Pendiente de pago' && o.payment !== 'En verificación', 'Este pedido ya no se puede cancelar.');
    record(o, 'Cancelado', 'Cliente');
  });
}
function beginPayment(id) {
  transaction(s => {
    const o = order(id, s);
    demand(o && o.status === 'Pendiente de pago', 'El pedido no admite pagos.');
    demand(o.expires > Date.now() || o.payment === 'En verificación', 'La reserva del pedido venció.');
    o.payment = 'En verificación';
    if (!o.reference) o.reference = 'SIM-' + o.id + '-' + Date.now().toString(36).toUpperCase();
  });
}
function paymentResult(id, result) {
  transaction(s => {
    const o = order(id, s);
    demand(o && o.status === 'Pendiente de pago' && o.payment === 'En verificación', 'No hay un pago pendiente de verificar.');
    demand(['approved', 'rejected', 'pending'].includes(result), 'Resultado no válido.');
    if (result === 'pending') return;
    if (result === 'rejected') {
      o.payment = 'Rechazado';
      o.history.push({
        status: 'Pago simulado rechazado',
        at: Date.now(),
        by: 'Simulador'
      });
      return;
    }
    for (const i of o.items) {
      const p = product(i.id, s);
      demand(p && p.stock >= i.qty, 'El inventario requiere revisión.');
      p.stock -= i.qty;
    }
    o.payment = 'Confirmado';
    o.paidAt = Date.now();
    record(o, 'Pagado', 'Simulador');
  });
}
function nextStatus(o) {
  if (o.status === 'Pagado') return 'En preparación';
  if (o.status === 'En preparación') return o.delivery === 'delivery' ? 'En camino' : 'Listo para retiro';
  if (['En camino', 'Listo para retiro'].includes(o.status)) return 'Entregado';
  return '';
}
function advanceOrder(id, received = false) {
  transaction(s => {
    demand(s.role === 'admin', 'Cambia al modo Administrador.');
    const o = order(id, s);
    demand(o && o.payment === 'Confirmado', 'El pago debe estar confirmado.');
    const status = nextStatus(o);
    demand(status, 'El pedido no admite otro cambio.');
    demand(status !== 'Entregado' || received, 'Confirma que el cliente recibió el pedido.');
    record(o, status, 'Administrador');
  });
}
function expireReservations() {
  const ids = state.orders.filter(o => o.status === 'Pendiente de pago' && o.payment !== 'En verificación' && o.expires <= Date.now()).map(o => o.id);
  if (ids.length) transaction(s => {
    for (const id of ids) record(order(id, s), 'Vencido', 'Sistema');
  });
  return ids.length;
}

// ADMINISTRACIÓN DE PRODUCTOS E INVENTARIO
// ============================================================================

function upsertProduct(data, id) {
  return transaction(s => {
    demand(s.role === 'admin', 'Cambia al modo Administrador.');
    const sku = data.sku.trim().toUpperCase(),
      name = data.name.trim();
    demand(name.length >= 3 && name.length <= 100, 'El nombre debe tener entre 3 y 100 caracteres.');
    demand(sku.length >= 3 && sku.length <= 40, 'El SKU debe tener entre 3 y 40 caracteres.');
    demand(!s.products.some(p => p.sku === sku && p.id !== id), 'Este SKU ya existe.');
    demand(CATS.includes(data.category), 'Selecciona una categoría válida.');
    demand(Number.isSafeInteger(data.price) && data.price > 0 && data.price <= 100000000, 'El precio debe ser mayor que cero y no superar $1,000,000.');
    demand(data.description.trim().length >= 5, 'Agrega una descripción.');
    demand(data.image.startsWith('data:image/') || Object.hasOwn(ASSETS, data.image), 'Selecciona una imagen válida.');
    if (id) {
      const p = product(id, s);
      demand(p, 'El producto no existe.');
      Object.assign(p, {
        sku,
        name,
        category: data.category,
        price: data.price,
        description: data.description.trim(),
        compatibility: data.compatibility.trim() || 'No especificada',
        specs: data.specs.trim(),
        tag: data.tag,
        active: data.active,
        image: data.image
      });
      return id;
    }
    demand(Number.isSafeInteger(data.stock) && data.stock >= 0 && data.stock <= 1000000, 'Las existencias deben ser un entero entre 0 y 1,000,000.');
    const newId = 'p-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
    s.products.push({
      ...data,
      id: newId,
      sku,
      name
    });
    return newId;
  });
}
function adjustInventory(id, delta, reason) {
  transaction(s => {
    demand(s.role === 'admin', 'Cambia al modo Administrador.');
    const p = product(id, s);
    demand(p, 'El producto no existe.');
    demand(Number.isSafeInteger(delta) && delta !== 0, 'Escribe un ajuste entero distinto de cero.');
    demand(reason.trim().length >= 5, 'Indica un motivo de al menos 5 caracteres.');
    const stock = p.stock + delta;
    demand(stock >= reserved(id, s), 'El ajuste dejaría existencias por debajo de las unidades reservadas.');
    demand(stock <= 1000000, 'El inventario no puede superar 1,000,000 de unidades.');
    s.adjustments.unshift({
      id: 'adj-' + Date.now(),
      productId: id,
      sku: p.sku,
      delta,
      before: p.stock,
      after: stock,
      reason: reason.trim(),
      at: Date.now(),
      by: 'Administrador'
    });
    p.stock = stock;
  });
}
function toggleFavorite(id) {
  transaction(s => {
    s.favorites = s.favorites.includes(id) ? s.favorites.filter(x => x !== id) : [...s.favorites, id];
  });
}
function toggleProduct(id) {
  transaction(s => {
    demand(s.role === 'admin', 'Cambia al modo Administrador.');
    const p = product(id, s);
    demand(p, 'Producto no encontrado.');
    p.active = !p.active;
  });
}

function filteredProducts() {
  let list = state.products.filter(p => p.active);
  const search = ui.search.toLocaleLowerCase('es').trim();
  if (search) list = list.filter(p => (p.name + ' ' + p.sku + ' ' + p.description).toLocaleLowerCase('es').includes(search));
  if (ui.category !== 'Todos') list = list.filter(p => p.category === ui.category);
  if (ui.favoritesOnly) list = list.filter(p => state.favorites.includes(p.id));
  if (ui.compatibility !== 'Todas') list = list.filter(p => p.compatibility === ui.compatibility);
  if (ui.priceMax !== '') list = list.filter(p => p.price <= Math.round(Number(ui.priceMax) * 100));
  if (ui.sort === 'price-up') list.sort((a, b) => a.price - b.price);
  if (ui.sort === 'price-down') list.sort((a, b) => b.price - a.price);
  if (ui.sort === 'name') list.sort((a, b) => a.name.localeCompare(b.name, 'es'));
  if (ui.sort === 'stock') list.sort((a, b) => available(b.id) - available(a.id));
  return list;
}

function checkoutFields() {

  expireReservations();
  const [r, id] = route();

  document.getElementById('storage-warning').hidden = storageOK;

  if (r === 'inicio' || r === 'catalogo') content = catalogHTML(r === 'inicio');else if (r === 'producto') content = detailHTML(id);else if (r === 'carrito') content = cartHTML();else if (r === 'pedidos') content = ordersHTML();else if (r === 'pedido') content = orderDetailHTML(id);else if (r === 'admin') content = adminHTML(id || 'productos');else if (r === 'admin-pedido') content = state.role === 'admin' ? orderDetailHTML(id, true) : adminHTML();else content = `<div class="wrap section">${emptyHTML('Esta página no existe', 'Vuelve al catálogo para seguir explorando.')}</div>`;

function modal(title, body, wide = false) {
  const d = document.getElementById('dialog');
  if (d.open) d.close();
  d.classList.toggle('wide', wide);
  d.innerHTML = `<div class="dialog-head"><h2 id="dialog-title">${e(title)}</h2><button class="plain" data-action="close-dialog" aria-label="Cerrar ventana">${icon('close')}</button></div><div class="dialog-body">${body}</div>`;
  d.showModal();
}
function closeModal() {
  document.getElementById('dialog').close();
}
function confirmModal(title, message, action, id, label = 'Confirmar') {
  modal(title, `<p class="small-text">${e(message)}</p><div class="dialog-foot"><button class="btn outline" data-action="close-dialog">Volver</button><button class="btn" data-action="${action}" data-id="${e(id || '')}">${e(label)}</button></div>`);
}

Imagen cargada</option>' : ''}</select></label><label class="field">O sube una imagen<input id="product-image-upload" type="file" accept="image/png,image/jpeg,image/webp"><span class="hint">PNG, JPG o WebP, hasta 1 MB.</span></label><div class="span2 flex-row"><img id="product-image-preview" src="${p ? image(p) : ASSETS.mouse}" alt="Vista previa" style="width:80px;height:70px;object-fit:contain"><label class="switch-label"><input name="active" type="checkbox"${p?.active !== false ? ' checked' : ''}>Publicado en el catálogo</label></div></div><div id="product-error"></div><div class="dialog-foot"><button type="button" class="btn outline" data-action="close-dialog">Cancelar</button><button class="btn" type="submit">${icon('check')}Guardar producto</button></div></form>`);

function downloadSummary(id) {
  const o = order(id);
  const text = ['TECHSTORE · RESUMEN DE PEDIDO', o.id, stamp(o.created), 'Estado: ' + o.status, 'Pago: ' + o.payment, 'Referencia simulada: ' + (o.reference || 'Sin pago'), '', ...o.items.map(i => `${i.name} · ${i.qty} x ${cash(i.price)} = ${cash(i.qty * i.price)}`), '', 'Subtotal: ' + cash(o.subtotal), 'Envío: ' + cash(o.shipping), 'TOTAL: ' + cash(o.total), '', o.delivery === 'delivery' ? 'Entrega a domicilio' : 'Retiro en tienda', o.customer.name, o.customer.email, o.customer.phone, o.delivery === 'delivery' ? o.customer.address : 'Mostrador TechStore (demostración)', '', 'Comprobante de demostración. No es factura fiscal ni acredita un cobro real.'].join('\n');
  const url = URL.createObjectURL(new Blob([text], {
    type: 'text/plain;charset=utf-8'
  }));
  const a = document.createElement('a');
  a.href = url;
  a.download = o.id + '-resumen.txt';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function updateZoom() {
  const n = document.getElementById('zoom-image');
  if (n) {
    n.style.transform = `scale(${ui.zoom})`;
    document.getElementById('zoom-label').textContent = Math.round(ui.zoom * 100) + ' %';
  }
}
function resetFilters() {
  Object.assign(ui, {
    category: 'Todos',
    search: '',
    sort: 'default',
    compatibility: 'Todas',
    priceMax: '',
    favoritesOnly: false
  });
}
function resetOrderFilters() {
  Object.assign(ui, {
    orderSearch: '',
    orderStatus: 'Todos',
    orderDelivery: 'Todos'
  });
}
function refreshKeepingFocus(id) {
  const n = document.getElementById(id);
  const pos = n?.selectionStart;
  render();
  const next = document.getElementById(id);
  if (next) {
    next.focus();
    if (typeof pos === 'number' && next.type !== 'number') next.setSelectionRange(pos, pos);
  }
}
// ============================================================================
// EVENTOS: BOTONES Y NAVEGACIÓN
// ============================================================================

document.addEventListener('click', event => {
  const b = event.target.closest('[data-action]');
  if (!b || b.disabled) return;
  event.preventDefault();
  const a = b.dataset.action,
    id = b.dataset.id;
  try {
    if (a === 'skip') {
      document.getElementById('contenido').focus();
    } else if (a === 'catalog') {
      resetFilters();
      if (route()[0] === 'inicio') {
        document.getElementById('catalog-section')?.scrollIntoView({
          behavior: 'smooth'
        });
      } else go('catalogo');
    } else if (a === 'product') {
      ui.quantity = 1;
      ui.detailTab = 'description';
      go('producto/' + id);
    } else if (a === 'category') {
      ui.category = b.dataset.category;
      ui.favoritesOnly = false;
      if (['inicio', 'catalogo'].includes(route()[0])) {
        render();
        if (route()[0] === 'inicio') document.getElementById('catalog-section')?.scrollIntoView();
      } else go('catalogo');
    } else if (a === 'peripherals') {
      resetFilters();
      ui.category = 'Periféricos';
      go('catalogo');
    } else if (a === 'filters') {
      ui.filters = !ui.filters;
      render();
    } else if (a === 'reset-filters') {
      resetFilters();
      render();
    } else if (a === 'favorites') {
      ui.favoritesOnly = !ui.favoritesOnly;
      ui.search = '';
      ui.category = 'Todos';
      go('catalogo');
    } else if (a === 'favorite') {
      toggleFavorite(id);
      render();
      toast(state.favorites.includes(id) ? 'Guardado en favoritos.' : 'Eliminado de favoritos.');
    } else if (a === 'add' || a === 'detail-add' || a === 'gallery-add') {
      addToCart(id, a === 'detail-add' ? ui.quantity : 1);
      if (a === 'gallery-add') closeModal();
      render();
      toast('Producto añadido al carrito.');
      if (a === 'detail-add' || a === 'gallery-add') go('carrito');
    } else if (a === 'detail-plus' || a === 'detail-minus') {
      ui.quantity = Math.max(1, Math.min(available(id), ui.quantity + (a === 'detail-plus' ? 1 : -1)));
      render();
    } else if (a === 'detail-tab') {
      ui.detailTab = b.dataset.tab;
      render();
    } else if (a === 'cart-plus' || a === 'cart-minus') {
      changeCart(id, a === 'cart-plus' ? 1 : -1);
      render();
    } else if (a === 'remove') {
      transaction(s => delete s.cart[id]);
      render();
      toast('Producto eliminado del carrito.');
    } else if (a === 'clear-cart') confirmModal('Vaciar carrito', '¿Quieres quitar todos los productos del carrito?', 'clear-cart-confirm', null, 'Vaciar carrito');else if (a === 'clear-cart-confirm') {
      transaction(s => s.cart = {});
      closeModal();
      render();
      toast('Carrito vacío.');
    } else if (a === 'admin') setRole('admin');else if (a === 'client') setRole('cliente');else if (a === 'orders') go('pedidos');else if (a === 'gallery') galleryModal(id);else if (a === 'close-dialog') closeModal();else if (a === 'zoom-in') {
      ui.zoom = Math.min(3, ui.zoom + .25);
      updateZoom();
    } else if (a === 'zoom-out') {
      ui.zoom = Math.max(.5, ui.zoom - .25);
      updateZoom();
    } else if (a === 'zoom-reset') {
      ui.zoom = 1;
      updateZoom();
    } else if (a === 'new-product') productModal();else if (a === 'edit-product') productModal(id);else if (a === 'toggle-product') {
      const p = product(id);
      confirmModal(p.active ? 'Desactivar producto' : 'Publicar producto', p.active ? 'El producto se ocultará del catálogo. Los pedidos anteriores conservarán sus datos.' : 'El producto volverá a aparecer en el catálogo.', 'toggle-product-confirm', id, p.active ? 'Desactivar' : 'Publicar');
    } else if (a === 'toggle-product-confirm') {
      toggleProduct(id);
      closeModal();
      render();
      toast('Estado del producto actualizado.');
    } else if (a === 'adjust') adjustModal(id);else if (a === 'inventory-history') historyModal();else if (a === 'reset-order-filters') {
      resetOrderFilters();
      render();
    } else if (a === 'pay') {
      beginPayment(id);
      render();
      payModal(id);
    } else if (a.startsWith('payment-') && ['payment-approved', 'payment-rejected', 'payment-pending'].includes(a)) {
      const result = a.slice(8);
      paymentResult(id, result);
      closeModal();
      render();
      toast(result === 'approved' ? 'Pago simulado aprobado.' : result === 'rejected' ? 'Pago rechazado. Puedes reintentarlo.' : 'El pago sigue en verificación.', result === 'rejected');
    } else if (a === 'cancel-order') confirmModal('Cancelar pedido', 'Se liberarán las unidades reservadas. ¿Deseas continuar?', 'cancel-order-confirm', id, 'Cancelar pedido');else if (a === 'cancel-order-confirm') {
      cancelOrder(id);
      closeModal();
      render();
      toast('Pedido cancelado. Reserva liberada.');
    } else if (a === 'advance') {
      const o = order(id),
        next = nextStatus(o);
      confirmModal('Actualizar estado', next === 'Entregado' ? 'Confirma que el cliente recibió el pedido o lo retiró en tienda.' : 'El pedido pasará a: ' + next + '.', 'advance-confirm', id, next === 'Entregado' ? 'Confirmar recepción' : 'Actualizar');
    } else if (a === 'advance-confirm') {
      advanceOrder(id, true);
      closeModal();
      render();
      toast('Estado del pedido actualizado.');
    } else if (a === 'download-order') downloadSummary(id);else if (a === 'delivery-info') modal('Entrega a domicilio', `<p class="small-text">La cobertura de demostración comprende la <b>Zona central</b>, con un costo de <b>$4.99</b> por pedido. Selecciona esa zona al confirmar tu compra.</p><p class="small-text muted">Las zonas comerciales reales y sus direcciones deben configurarse antes de utilizar la tienda con clientes reales. Fuera de la cobertura puedes elegir retiro sin costo.</p>`);else if (a === 'pickup-info') modal('Retiro en tienda', '<p class="small-text"><b>Mostrador TechStore · punto de demostración</b><br>Horario: lunes a viernes, de 9:00 a 18:00.<br>El retiro no tiene costo. Revisa Mis pedidos y espera el estado “Listo para retiro”.</p><p class="small-text muted">La dirección comercial real está pendiente de configuración.</p>');else if (a === 'payment-info') modal('Pago simulado', '<p class="small-text">Confirma tu pedido y abre el simulador desde Mis pedidos. Puedes elegir un resultado aprobado, rechazado o pendiente de verificación.</p><p class="small-text muted">Este archivo no conecta con una pasarela externa ni realiza cobros reales.</p>');else if (a === 'about') modal('Acerca de TechStore', '<p class="small-text">Aplicación local de demostración basada en el diseño TechStore. Todo el HTML, CSS, JavaScript y las imágenes están incluidos en este único archivo.</p><p class="small-text">El catálogo, el carrito, los favoritos, el inventario y los pedidos se guardan en este navegador. El modo Administrador es un selector de demostración sin inicio de sesión.</p><p class="small-text muted">No hay servidor, sincronización entre dispositivos, autenticación real ni cobros. No ingreses datos sensibles. Las imágenes provienen de la referencia original y pueden verse pixeladas al ampliarse.</p>');
  } catch (err) {
    friendlyError(err);
  }
});
// ============================================================================
// EVENTOS: TECLADO Y CAMPOS DE FORMULARIO
// ============================================================================

document.addEventListener('keydown', event => {
  if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('[role="button"][data-action]')) {
    event.preventDefault();
    event.target.click();
  }
});
document.addEventListener('input', event => {
  const t = event.target;
  if (t.id === 'catalog-search') {
    ui.search = t.value;
    updateGrid();
  } else if (t.id === 'catalog-max') {
    ui.priceMax = t.value;
    updateGrid();
  } else if (t.id === 'admin-search') {
    ui.adminSearch = t.value;
    refreshKeepingFocus(t.id);
  } else if (t.id === 'order-search') {
    ui.orderSearch = t.value;
    refreshKeepingFocus(t.id);
  } else if (t.closest('#checkout-form') && t.name && t.name !== 'delivery') {
    transaction(s => s.checkout[t.name] = t.value);
  }
});
document.addEventListener('change', event => {
  const t = event.target;
  try {
    if (t.id === 'catalog-sort') {
      ui.sort = t.value;
      updateGrid();
    } else if (t.id === 'catalog-compatibility') {
      ui.compatibility = t.value;
      updateGrid();
    } else if (t.id === 'order-status') {
      ui.orderStatus = t.value;
      render();
    } else if (t.id === 'order-delivery') {
      ui.orderDelivery = t.value;
      render();
    } else if (t.name === 'delivery' && t.closest('#checkout-form')) {
      transaction(s => s.checkout.delivery = t.value);
      render();
    } else if (t.name === 'zone' && t.closest('#checkout-form')) {
      transaction(s => s.checkout.zone = t.value);
      render();
    } else if (t.id === 'product-image-choice') {
      if (t.value !== 'custom') {
        editedImage = t.value;
        document.getElementById('product-image-preview').src = ASSETS[t.value];
      }
    } else if (t.id === 'product-image-upload') {
      const f = t.files[0];
      if (!f) return;
      demand(['image/png', 'image/jpeg', 'image/webp'].includes(f.type), 'Selecciona una imagen PNG, JPG o WebP.');
      demand(f.size <= 1024 * 1024, 'La imagen no debe superar 1 MB.');
      imageLoading = true;
      const reader = new FileReader();
      reader.onload = () => {
        imageLoading = false;
        const preview = document.getElementById('product-image-preview');
        if (!preview) return;
        editedImage = String(reader.result);
        preview.src = editedImage;
        toast('Imagen lista para guardar.');
      };
      reader.onerror = () => {
        imageLoading = false;
        toast('No se pudo leer la imagen.', true);
      };
      reader.readAsDataURL(f);
    }
  } catch (err) {
    friendlyError(err);
  }
});
// ============================================================================
// EVENTOS: ENVÍO Y VALIDACIÓN DE FORMULARIOS
// ============================================================================

document.addEventListener('submit', event => {
  const form = event.target;
  if (!['checkout-form', 'product-form', 'inventory-form'].includes(form.id)) return;
  event.preventDefault();
  const data = new FormData(form);
  try {
    if (form.id === 'checkout-form') {
      transaction(s => {
        for (const k of ['name', 'email', 'phone', 'address', 'zone', 'notes']) if (data.has(k)) s.checkout[k] = String(data.get(k));
        s.checkout.delivery = String(data.get('delivery'));
      });
      const id = createOrder();
      go('pedido/' + id);
      toast('Pedido creado. Tus productos están reservados.');
    } else if (form.id === 'product-form') {
      demand(!imageLoading, 'Espera a que termine de cargar la imagen.');
      const id = form.dataset.id || null;
      upsertProduct({
        name: String(data.get('name')),
        sku: String(data.get('sku')),
        category: String(data.get('category')),
        price: Math.round(Number(data.get('price')) * 100),
        stock: id ? product(id).stock : Number(data.get('stock')),
        description: String(data.get('description')),
        compatibility: String(data.get('compatibility')),
        specs: String(data.get('specs')),
        tag: String(data.get('tag')),
        active: data.has('active'),
        image: editedImage
      }, id);
      closeModal();
      render();
      toast('Producto guardado correctamente.');
    } else if (form.id === 'inventory-form') {
      adjustInventory(form.dataset.id, Number(data.get('delta')), String(data.get('reason')));
      closeModal();
      render();
      toast('Inventario actualizado.');
    }
  } catch (err) {
    const target = form.id === 'product-form' ? 'product-error' : form.id === 'inventory-form' ? 'inventory-error' : null;
    if (target) document.getElementById(target).innerHTML = `<div class="error-message" role="alert">${e(err.message)}</div>`;else friendlyError(err);
  }
});
// ============================================================================
// SINCRONIZACIÓN, RESERVAS E INICIALIZACIÓN
// ============================================================================

window.addEventListener('hashchange', () => {
  closeModal();
  ui.quantity = 1;
  ui.detailTab = 'description';
  render();
  window.scrollTo(0, 0);
});
window.addEventListener('storage', event => {
  if (event.key === KEY) {
    state = load();
    render();
    toast('Se actualizaron los datos desde otra pestaña.');
  }
});
document.getElementById('dialog').addEventListener('click', event => {
  if (event.target === event.currentTarget) {
    const rect = event.currentTarget.getBoundingClientRect();
    if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) closeModal();
  }
});
setInterval(() => {
  if (expireReservations()) {
    render();
    toast('Una reserva pendiente venció. Sus unidades se liberaron.');
  }
}, 30000);
render();
    </script>
